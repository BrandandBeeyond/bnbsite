<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img"><title>Diagram of the information gap between known and wanted</title><rect width="1200" height="700" fill="#111"/><rect x="150" y="300" width="330" height="120" rx="14" fill="#2a2a2a"/><rect x="720" y="300" width="330" height="120" rx="14" fill="#f9b000"/><path d="M500 360 L700 360" stroke="#f5f5f5" stroke-width="6" stroke-dasharray="16 12"/><polygon points="700,340 730,360 700,380" fill="#f5f5f5"/><text x="315" y="375" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#f5f5f5" text-anchor="middle">What they know</text><text x="885" y="375" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#111" text-anchor="middle">What they want</text><text x="600" y="280" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#f9b000" text-anchor="middle">THE GAP</text><text x="600" y="560" font-family="Arial,sans-serif" font-size="36" font-weight="400" fill="#f5f5f5" text-anchor="middle">Curiosity pulls people across the gap</text></svg>