<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img"><title>Gauge measuring how much customers would miss a brand</title><rect width="1200" height="700" fill="#111"/><path d="M300 520 A300 300 0 0 1 900 520" fill="none" stroke="#2a2a2a" stroke-width="60"/><path d="M300 520 A300 300 0 0 1 780 280" fill="none" stroke="#f9b000" stroke-width="60"/><line x1="600" y1="520" x2="760" y2="330" stroke="#f5f5f5" stroke-width="10" stroke-linecap="round"/><circle cx="600" cy="520" r="22" fill="#f5f5f5"/><text x="600" y="620" font-family="Arial,sans-serif" font-size="44" font-weight="700" fill="#f5f5f5" text-anchor="middle">The Missability Score</text><text x="300" y="580" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#f5f5f5" text-anchor="middle">Replaceable</text><text x="900" y="580" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#f5f5f5" text-anchor="middle">Irreplaceable</text></svg>