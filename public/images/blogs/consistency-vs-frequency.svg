<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img"><title>Chart comparing consistent branding versus random frequency</title><rect width="1200" height="700" fill="#111"/><line x1="150" y1="500" x2="1080" y2="500" stroke="#2a2a2a" stroke-width="4"/><polyline points="150,480 240,360 330,240 420,420 510,300 600,480 690,360 780,240 870,420 960,300 1050,480" fill="none" stroke="#888" stroke-width="6"/><polyline points="150,480 240,450 330,420 420,390 510,360 600,330 690,300 780,270 870,240 960,210 1050,180" fill="none" stroke="#f9b000" stroke-width="8"/><text x="1000" y="150" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#f9b000" text-anchor="end">Consistent</text><text x="1000" y="420" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#888" text-anchor="end">Everywhere, inconsistent</text><text x="600" y="600" font-family="Arial,sans-serif" font-size="40" font-weight="400" fill="#f5f5f5" text-anchor="middle">Memory grows with consistency, not noise</text></svg>