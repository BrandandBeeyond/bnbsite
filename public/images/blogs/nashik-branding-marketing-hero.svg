<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" role="img" aria-labelledby="t d"><title id="t">Branding and marketing working together</title><desc id="d">Animated brand logo mark at the center with marketing icons orbiting around it</desc><defs><radialGradient id="glow" cx="50%" cy="50%" r="60%"><stop offset="0" stop-color="#f9b000" stop-opacity=".16"/><stop offset="1" stop-color="#f9b000" stop-opacity="0"/></radialGradient><linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffd166"/><stop offset="1" stop-color="#f9b000"/></linearGradient><linearGradient id="cool" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5b8cff"/><stop offset="1" stop-color="#2ee6c5"/></linearGradient><linearGradient id="warm" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f9b000"/><stop offset="1" stop-color="#ff5d8f"/></linearGradient></defs><style>text{font-family:Arial,Helvetica,sans-serif}@keyframes ringp0{0%{opacity:.55;transform:scale(1)}100%{opacity:0;transform:scale(2.8)}}.ringp0{animation:ringp0 3.6s ease-out infinite;animation-delay:0.0s;transform-box:fill-box;transform-origin:center}@keyframes ringp1{0%{opacity:.55;transform:scale(1)}100%{opacity:0;transform:scale(2.8)}}.ringp1{animation:ringp1 3.6s ease-out infinite;animation-delay:1.2s;transform-box:fill-box;transform-origin:center}@keyframes ringp2{0%{opacity:.55;transform:scale(1)}100%{opacity:0;transform:scale(2.8)}}.ringp2{animation:ringp2 3.6s ease-out infinite;animation-delay:2.4s;transform-box:fill-box;transform-origin:center}@keyframes orbit{to{transform:rotate(360deg)}}.orbit{animation:orbit 26s linear infinite;animation-delay:0s;transform-box:view-box;transform-origin:400px 210px}@keyframes counter{to{transform:rotate(-360deg)}}.counter{animation:counter 26s linear infinite;animation-delay:0s;transform-box:view-box;transform-origin:0px 0px}@keyframes k0{0%,30.00%{opacity:0;transform:scale(0.3)}39.00%,90.00%{opacity:1;transform: